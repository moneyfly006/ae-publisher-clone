<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden}
  body{font-family:"Noto Sans SC",sans-serif;background:#06070C;color:#F3F5FB;position:relative}
  .bg{position:absolute;inset:0;overflow:hidden}
  .glow{position:absolute;border-radius:50%;filter:blur(100px);opacity:.55}
  .g1{width:860px;height:620px;left:-220px;top:-220px;background:#7C5CFF}
  .g2{width:760px;height:560px;right:-240px;top:320px;background:#00D2A8;opacity:.32}
  .g3{width:820px;height:600px;left:120px;bottom:-320px;background:#3B6CFF;opacity:.25}
  .grid{position:absolute;inset:0;opacity:.3;
    background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:72px 72px;
    mask-image:radial-gradient(ellipse at 50% 8%,#000 22%,transparent 72%);
    -webkit-mask-image:radial-gradient(ellipse at 50% 8%,#000 22%,transparent 72%);}
  .wrap{position:relative;height:100%;padding:96px 84px 110px;display:flex;flex-direction:column}
  .eyebrow{font-family:"JetBrains Mono",monospace;font-size:22px;letter-spacing:.24em;color:#00D2A8}
  h1{font-family:"Noto Serif SC",serif;font-weight:900;font-size:84px;line-height:1.14;letter-spacing:-.02em;margin-top:26px}
  .grad{background:linear-gradient(110deg,#fff,#A78BFA 42%,#00D2A8 88%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin-top:26px;font-size:29px;color:#A8B0C6;line-height:1.55}
  .shot{margin-top:52px;border-radius:26px;overflow:hidden;border:1px solid rgba(255,255,255,.16);
    box-shadow:0 46px 120px rgba(0,0,0,.7),0 0 0 1px rgba(124,92,255,.18);position:relative}
  .shot img{width:100%;height:560px;object-fit:cover;object-position:top;display:block}
  .shot::after{content:"";position:absolute;inset:auto 0 0 0;height:110px;background:linear-gradient(180deg,transparent,#06070C)}
  .badge{position:absolute;left:26px;top:24px;z-index:2;font-family:"JetBrains Mono",monospace;font-size:17px;
    letter-spacing:.12em;color:#07080D;background:linear-gradient(120deg,#8B6BFF,#00D2A8);padding:9px 18px;border-radius:999px;font-weight:700}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:46px}
  .stat{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.11);border-radius:22px;padding:26px 24px}
  .stat b{font-family:"JetBrains Mono",monospace;font-size:56px;line-height:1;
    background:linear-gradient(120deg,#fff,#A78BFA);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat span{display:block;margin-top:12px;font-size:22px;color:#98A0B8;line-height:1.5}
  .checks{margin-top:40px;display:flex;flex-direction:column;gap:20px}
  .chk{display:flex;gap:20px;align-items:flex-start;background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:22px 26px}
  .chk i{flex:none;width:38px;height:38px;border-radius:11px;background:rgba(0,210,168,.14);
    border:1px solid rgba(0,210,168,.4);color:#00D2A8;font-style:normal;display:grid;place-items:center;font-size:21px;font-weight:700}
  .chk b{display:block;font-size:25px;font-weight:700}
  .chk span{display:block;font-size:20px;color:#98A0B8;margin-top:4px;line-height:1.5}
  .footer{margin-top:auto;padding-top:36px;border-top:1px solid rgba(255,255,255,.12);
    display:flex;align-items:center;justify-content:space-between;gap:30px}
  .foot-l{font-size:24px;color:#98A0B8}
  .foot-l b{display:block;font-size:34px;color:#F3F5FB;margin-top:8px;letter-spacing:.01em}
  .cta{background:linear-gradient(120deg,#8B6BFF,#00D2A8);color:#07080D;font-weight:700;
    padding:24px 34px;border-radius:20px;font-size:28px;text-align:center;line-height:1.3;white-space:nowrap}
  .cta small{display:block;font-size:19px;font-weight:500;opacity:.8;margin-top:4px}
</style></head>
<body>
<div class="bg"><div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div><div class="grid"></div></div>
<div class="wrap">
  <div class="eyebrow">速卖通 · AI 批量上架</div>
  <h1>把 100 个商品，<br/><span class="grad">交给 1 次点击</span></h1>
  <div class="sub">AI 英文文案 · 白底去水印 · 价格与利润 · 批量发布<br/>采集箱进，可发布商品出。</div>

  <div class="shot"><span class="badge">真实界面 · v1.0.2</span><img src="../assets/shots/p0.png" alt="" /></div>

  <div class="stats">
    <div class="stat"><b>1</b><span>键跑完全流程</span></div>
    <div class="stat"><b>¥0.1</b><span>一张图的成本</span></div>
    <div class="stat"><b>0</b><span>重复扣费</span></div>
  </div>

  <div class="checks">
    <div class="chk"><i>✓</i><div><b>文案 · 图片 · 价格 · 属性，一次配好</b><span>模板继承类目/运费/属性，标题与 SKU 按新商品生成</span></div></div>
    <div class="chk"><i>✓</i><div><b>失败自动重试，断点续传</b><span>中途停了也能接着跑，不用从头再来</span></div></div>
    <div class="chk"><i>✓</i><div><b>数据只在本机，不碰账号密码</b><span>本地读 Cookie，日志可导出，问题能追溯</span></div></div>
  </div>

  <div class="footer">
    <div class="foot-l">免费下载 v1.0.2 · Windows / macOS<b>咨询 QQ 3219904322</b></div>
    <div class="cta">领取试用<small>发商品链接</small></div>
  </div>
</div>
</body></html>
