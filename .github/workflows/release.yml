name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M1/M2/M3/M4)
          - os: macos-latest
            artifact: AuroraList-macos-arm64
            arch: arm64
          # Intel Mac (x86_64) — macos-13 was retired on 2025-12-04,
          # GitHub's official replacement is macos-15-intel
          - os: macos-15-intel
            artifact: AuroraList-macos-x64
            arch: x64
          - os: windows-latest
            artifact: AuroraList-windows
            arch: x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller nuitka

      - name: Run tests (smoke)
        shell: bash
        run: |
          PYTHONPATH=src python tests/test_api_save.py || true

      - name: Harden (Nuitka compile core modules)
        shell: bash
        run: |
          python tools/harden.py

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller app.spec --noconfirm --log-level WARN

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          # -y 保留 .app 内的符号链接，否则解压后无法运行
          zip -r -y ../AuroraList-macos-${{ matrix.arch }}.zip AuroraList.app
          cd ..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/AuroraList/* -DestinationPath AuroraList-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            AuroraList-*.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show artifacts
        run: find artifacts -type f | head -20

      - name: Prepare Chinese release notes
        shell: bash
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.event.inputs.version || '1.0.0') }}"
          python3 - "$TAG" <<'PY'
          import re, sys
          tag = sys.argv[1].strip()
          ver = tag[1:] if tag.lower().startswith("v") else tag
          body = ""
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
              pattern = re.compile(
                  r"^##\s*v?" + re.escape(ver) + r".*?$\n(.*?)(?=^##\s|\Z)",
                  re.S | re.M)
              m = pattern.search(text)
              if m:
                  body = (m.group(1) or "").strip()
          except FileNotFoundError:
              pass
          if not body:
              body = "- 本次更新包含问题修复与稳定性改进；详细说明见项目提交记录。"
          downloads = (
              "## 下载\n\n"
              "- macOS（Apple Silicon / M1–M4）：`AuroraList-macos-arm64.zip`\n"
              "- macOS（Intel x86_64）：`AuroraList-macos-x64.zip`\n"
              "- Windows 便携版：`AuroraList-windows-x64.zip`\n"
              "- Windows 安装包：`AuroraList-Setup-" + ver + ".exe`\n\n"
              "> 请选择与你的芯片匹配的 macOS 包：苹果菜单 → 关于本机 → 芯片 / 处理器。\n"
          )
          with open("release-notes.md", "w", encoding="utf-8") as fh:
              fh.write("## 更新内容\n\n" + body + "\n\n" + downloads)
          PY
          echo "----- release-notes.md -----"
          head -40 release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.event.inputs.version || '1.0.0') }}
          name: AuroraList ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.event.inputs.version || '1.0.0') }}
          draft: false
          prerelease: false
          body_path: release-notes.md
          files: |
            artifacts/**/AuroraList-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
